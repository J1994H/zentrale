<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <!--
    Datenschutz-Riegel (Content Security Policy):
    Die App darf nur ihre eigenen Dateien laden und keine Verbindung zu fremden Servern aufbauen.
    Später (Merkliste mit Zusammenfassung) kommt bei connect-src genau eine Ausnahme dazu:
    https://api.anthropic.com
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; media-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111315">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zentrale">
  <title>Zentrale</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main id="main"></main>
  <nav class="tabbar" id="tabbar" aria-label="Bereiche"></nav>
  <noscript>Diese App braucht JavaScript.</noscript>
</body>
</html>
